<text x="44" y="515" font-family="sans-serif" font-size="13" fill="#9aaac1" font-weight="normal">All columns are changes in query loss. Actual refits are converged numerical solutions, not exact arithmetic.</text>
<rect x="26" y="546" width="518" height="142" rx="10" fill="#1b293f" stroke="#32445d"/>
<rect x="558" y="546" width="536" height="142" rx="10" fill="#1b293f" stroke="#32445d"/>
<text x="44" y="575" font-family="sans-serif" font-size="17" fill="#67e8f9" font-weight="bold">Visible finite-deletion error: row 5</text>
<text x="44" y="605" font-family="monospace" font-size="20" fill="#fbbf24" font-weight="normal">linear +0.203204 vs refit +0.305655</text>
<text x="44" y="633" font-family="monospace" font-size="17" fill="#dce7fa" font-weight="normal">signed error -0.102451</text>
<text x="44" y="662" font-family="sans-serif" font-size="13" fill="#9aaac1" font-weight="normal">No claim that deleting a full row is infinitesimal.</text>
<text x="576" y="575" font-family="sans-serif" font-size="17" fill="#67e8f9" font-weight="bold">Normalization and damping are distinct</text>
<text x="576" y="605" font-family="sans-serif" font-size="14" fill="#dce7fa" font-weight="normal">Retained-row mean with the same ridge is another objective.</text>
<text x="576" y="630" font-family="sans-serif" font-size="14" fill="#dce7fa" font-weight="normal">H + 0.5 I changes the inverse; the fitted theta stays fixed.</text>
<text x="576" y="660" font-family="sans-serif" font-size="14" fill="#9aaac1" font-weight="normal">It is not the derivative of a ridge-0.6 retrained model.</text>
<rect x="26" y="704" width="1068" height="133" rx="10" fill="#1b293f" stroke="#32445d"/>
<text x="44" y="733" font-family="sans-serif" font-size="17" fill="#67e8f9" font-weight="bold">Convergence and solve witnesses</text>
<text x="44" y="764" font-family="monospace" font-size="17" fill="#dce7fa" font-weight="normal">max |gradient| across 15 fits: 8.197e-11</text>
<text x="44" y="791" font-family="monospace" font-size="17" fill="#dce7fa" font-weight="normal">max influence solve residual: 5.551e-17</text>
<text x="44" y="818" font-family="sans-serif" font-size="13" fill="#9aaac1" font-weight="normal">Full JSON preserves Hessians, Cholesky factors, parameter directions, refits and line-search histories.</text>
<text x="28" y="865" font-family="sans-serif" font-size="14" fill="#9aaac1" font-weight="normal">Standard influence functions with independent finite-difference and deletion references. Developed synthetic fixture.</text>
<text x="28" y="886" font-family="sans-serif" font-size="13" fill="#9aaac1" font-weight="normal">Local supplied-model sensitivity, not causal attribution, mislabeled-row proof, neural-network scaling or an unlearning guarantee.</text>
</svg>
