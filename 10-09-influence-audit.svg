<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900">
<metadata id="report-zlib-base64"></metadata><rect width="1120" height="900" fill="#0f172a"/>
<text x="28" y="40" font-family="sans-serif" font-size="27" fill="#dce7fa" font-weight="bold">InfluenceLab | a derivative is not a deleted-data refit</text>
<text x="28" y="68" font-family="sans-serif" font-size="15" fill="#9aaac1" font-weight="normal">Convex binary logistic regression, 7 developed rows, original-N normalization, ridge 0.1.</text>
<rect x="26" y="88" width="1068" height="116" rx="10" fill="#1b293f" stroke="#32445d"/>
<text x="44" y="115" font-family="sans-serif" font-size="17" fill="#67e8f9" font-weight="bold">One auditable objective</text>
<text x="44" y="143" font-family="monospace" font-size="17" fill="#dce7fa" font-weight="normal">R(theta,w) = sum_i w_i loss_i(theta) / N + lambda ||theta||² / 2</text>
<text x="44" y="171" font-family="sans-serif" font-size="15" fill="#dce7fa" font-weight="normal">dtheta/dw_i = -H^-1 gradient(loss_i) / N; deletion uses delta w_i = -1.</text>
<text x="44" y="190" font-family="sans-serif" font-size="13" fill="#9aaac1" font-weight="normal">All coordinates, including the explicit intercept, are regularized. No hidden jitter.</text>
<rect x="26" y="220" width="1068" height="310" rx="10" fill="#1b293f" stroke="#32445d"/>
