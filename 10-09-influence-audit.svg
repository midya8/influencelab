<text x="328" y="250" font-family="sans-serif" font-size="14" fill="#67e8f9" font-weight="bold">linear deletion</text>
<text x="512" y="250" font-family="sans-serif" font-size="14" fill="#67e8f9" font-weight="bold">actual fixed-N</text>
<text x="710" y="250" font-family="sans-serif" font-size="14" fill="#67e8f9" font-weight="bold">retained mean</text>
<text x="902" y="250" font-family="sans-serif" font-size="14" fill="#67e8f9" font-weight="bold">damped linear</text>
